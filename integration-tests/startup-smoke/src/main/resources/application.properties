quarkus.devservices.enabled=false
quarkus.http.test-port=0
app.name=startup-smoke
acceptance.input-topic=bip.startup-smoke.in
acceptance.group=startup-smoke
acceptance.accept-rejected=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.active=false
# No live services. The Kafka input stays stopped; internal failures must not reach Kafka.
acceptance.enabled=false
camel.component.kafka.brokers=localhost:1
kafka.bootstrap.servers=localhost:1
