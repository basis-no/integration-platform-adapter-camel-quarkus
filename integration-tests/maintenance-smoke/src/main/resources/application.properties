quarkus.devservices.enabled=false
quarkus.http.test-port=0
app.name=maintenance-smoke
acceptance.enabled=false
acceptance.input-topic=bip.maintenance-smoke.in
acceptance.group=maintenance-smoke
acceptance.accept-rejected=false
quarkus.datasource.db-kind=postgresql
quarkus.datasource.active=false
# No live services. The source is stopped; internal failures must not reach Kafka.
camel.component.kafka.brokers=localhost:1
kafka.bootstrap.servers=localhost:1

# Explicit runtime-only acceptance profile. No default service addresses or credentials.
%acceptance.app.name=${ACCEPTANCE_NAME}
%acceptance.acceptance.enabled=true
%acceptance.acceptance.input-topic=${ACCEPTANCE_INPUT_TOPIC}
%acceptance.acceptance.group=${ACCEPTANCE_GROUP}
%acceptance.acceptance.accept-rejected=${ACCEPTANCE_ACCEPT_REJECTED:false}
%acceptance.camel.component.kafka.brokers=${KAFKA_BOOTSTRAP_SERVERS}
%acceptance.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS}
%acceptance.basis.message-store.sink=postgres
%acceptance.basis.message-store.step-outcome-store=postgres
%acceptance.basis.message-store.dlq-uri=kafka:${ACCEPTANCE_DLQ_TOPIC}
%acceptance.basis.message-store.replay.input-topic-pattern=${ACCEPTANCE_INPUT_TOPIC}
%acceptance.quarkus.datasource.active=true
%acceptance.quarkus.datasource.jdbc.url=${POSTGRES_JDBC_URL}
%acceptance.quarkus.datasource.username=${POSTGRES_USERNAME}
%acceptance.quarkus.datasource.password=${POSTGRES_PASSWORD}
