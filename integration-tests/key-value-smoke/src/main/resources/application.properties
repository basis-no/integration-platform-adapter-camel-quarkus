quarkus.devservices.enabled=false
quarkus.http.test-port=0
quarkus.datasource.db-kind=postgresql
app.name=key-value-smoke
basis.message-store.sink=postgres
basis.message-store.step-outcome-store=noop
basis.message-store.dlq-uri=direct:synthetic-parking
basis.message-store.key-value.sweep-interval-seconds=3600
camel.component.kafka.brokers=localhost:1
kafka.bootstrap.servers=localhost:1
basis.traffic.signals=record_admitted,record_published
basis.traffic.input-topics=example-input
quarkus.http.host=127.0.0.1
