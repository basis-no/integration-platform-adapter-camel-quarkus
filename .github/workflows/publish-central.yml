name: Publish to Maven Central

# Tag-driven release per ADR-003: the pom stays on -SNAPSHOT on main; the
# version is derived from the tag (vX.Y.Z) at publish time. Requires repo
# secrets CENTRAL_TOKEN_USERNAME / CENTRAL_TOKEN_PASSWORD (Sonatype Central
# portal token) and GPG_PRIVATE_KEY / GPG_PASSPHRASE.

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag format
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$TAG' is not a release tag (vX.Y.Z); refusing to publish." >&2
            exit 1
          fi

      - name: Validate matching version changelog
        run: python3 scripts/check_changelog.py --tag "$TAG"

      - name: Validate and extract GitHub release notes
        run: python3 .github/scripts/release-notes.py --tag "$TAG" --output release-notes.md

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE

      - name: Set release version from tag
        run: mvn --batch-mode --no-transfer-progress versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false

      - name: Publish
        run: mvn --batch-mode --no-transfer-progress -Prelease deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract reviewed release notes
        run: python3 .github/scripts/release-notes.py --tag "$TAG" --output release-notes.md
      - name: Create GitHub Release and verify its notes
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json body,tagName > release-readback.json; then
            gh release create "$TAG" --verify-tag --title "Camel Quarkus adapter ${TAG#v}" --notes-file release-notes.md
            gh release view "$TAG" --json body,tagName > release-readback.json
          fi
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          release = json.loads(Path('release-readback.json').read_text())
          assert release['tagName'] == os.environ['TAG'], 'Release tag mismatch'
          assert release['body'] == Path('release-notes.md').read_text(), 'Release notes mismatch: review existing notes; never overwrite automatically'
          PYTHON
