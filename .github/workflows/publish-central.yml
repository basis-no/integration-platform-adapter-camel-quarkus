name: Verify published artifacts and create GitHub Release

# No tag-push build/upload. Candidate preparation and approved portal operations
# use release-candidate.yml. This path only reads existing artifacts and notes.
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: Existing approved final tag
      candidate_run:
        required: true
        description: Existing successful candidate inspection run
      bundle_sha256:
        required: true
        description: Reviewed candidate bundle SHA-256
      signer:
        required: true
        description: Trusted uppercase 40-character signing fingerprint

permissions:
  contents: read
  actions: read

concurrency:
  group: central-release-page-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  CANDIDATE_RUN: ${{ inputs.candidate_run }}
  BUNDLE_SHA256: ${{ inputs.bundle_sha256 }}
  SIGNER: ${{ inputs.signer }}

jobs:
  verify:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing tag and reviewed candidate inputs
        run: |
          version="$(.github/scripts/release-version-from-tag.sh "$TAG")"
          source_commit="$(git rev-parse "refs/tags/$TAG^{}")"
          python3 .github/scripts/release-candidate.py selection --mode upload --version "$version" --commit "$source_commit" --signer "$SIGNER" --candidate-run "$CANDIDATE_RUN" --bundle-hash "$BUNDLE_SHA256"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: central-candidate-${{ env.RELEASE_VERSION }}
          path: evidence
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Verify actual public payloads against the same reviewed candidate
        env:
          PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/central-public-readback-keyring"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          mkdir -m 700 "$GNUPGHOME"
          test -n "$PUBLIC_KEY"
          printf '%s\n' "$PUBLIC_KEY" | gpg --no-options --batch --import
          python3 .github/scripts/release-candidate.py artifact --mode upload --version "$RELEASE_VERSION" --commit "$SOURCE_COMMIT" --signer "$SIGNER" --candidate-run "$CANDIDATE_RUN" --bundle-hash "$BUNDLE_SHA256" --path evidence
          python3 .github/scripts/verify-public-release.py --pom source/pom.xml --version "$RELEASE_VERSION" --signer "$SIGNER" --expected-receipt evidence/candidate.json --output public-readback.json
      - name: Retain actual artifact readback
        uses: actions/upload-artifact@v7
        with:
          name: central-public-readback-${{ inputs.tag }}
          path: public-readback.json
          if-no-files-found: error
          retention-days: 90
      - name: Stop owned verifier agent and remove public-key keyring
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            case "$GNUPGHOME" in "$RUNNER_TEMP"/central-*) gpgconf --kill gpg-agent || true; rm -rf -- "$GNUPGHOME" ;; *) exit 1 ;; esac
          fi

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          path: source
          persist-credentials: false
      - name: Extract reviewed release notes from the existing tag
        run: python3 .github/scripts/release-notes.py --tag "$TAG" --changelog source/CHANGELOG.md --pom source/pom.xml --output release-notes.md
      - name: Create GitHub Release and compare existing notes without overwriting
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json body,tagName > release-readback.json; then
            gh release create "$TAG" --verify-tag --title "Camel Quarkus adapter ${TAG#v}" --notes-file release-notes.md
            gh release view "$TAG" --json body,tagName > release-readback.json
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('release-readback.json').read_text())
          assert release['tagName'] == os.environ['TAG'], 'Release tag mismatch'
          assert release['body'] == Path('release-notes.md').read_text(), 'Release notes mismatch: review; never overwrite automatically'
          PY
