name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - release/0.3

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify matching version changelog and its guard
        run: |
          python3 -m unittest discover -s tests -p "test_changelog.py"
          python3 scripts/check_changelog.py

      - name: Test release notes extraction
        run: python3 -m unittest discover -s tests -p "test_release_notes.py"

      - name: Test offline release packaging and recovery guards
        run: python3 .github/scripts/test-release-packaging.py

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and install adapter for the startup fixture
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          install

      - name: Verify Quarkus registration and dependency defaults
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -f integration-tests/maintenance-smoke/pom.xml
          verify

      - name: Verify public API documentation
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -DskipTests
          javadoc:javadoc
