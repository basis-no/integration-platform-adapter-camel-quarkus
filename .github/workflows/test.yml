name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test release notes extraction
        run: python3 -m unittest discover -s tests -p "test_release_notes.py"

      - name: Test offline release packaging and recovery guards
        run: python3 .github/scripts/test-release-packaging.py

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test release tag parser
        run: .github/scripts/test-release-version-from-tag.sh

      - name: Run adapter tests and install the adapter for the startup smoke
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          install

      - name: Read the installed adapter version
        run: |
          version="$(./mvnw --batch-mode --no-transfer-progress -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "ADAPTER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Boot the packaged adapter in a Quarkus application
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -f integration-tests/startup-smoke/pom.xml
          -Dadapter.version="$ADAPTER_VERSION"
          verify

      # The fixture below never pulls its image itself, so the pinned image is
      # pulled here. Each fixture run needs a unique run ID.
      - name: Pull the Key-Value Store fixture's pinned PostgreSQL image
        run: docker pull postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24

      - name: Verify the Key-Value Store and metrics at runtime
        run: |
          run_id="$(cat /proc/sys/kernel/random/uuid)"
          ./mvnw --batch-mode --no-transfer-progress \
            -f integration-tests/key-value-smoke/pom.xml \
            -Dadapter.version="$ADAPTER_VERSION" \
            -Dbip.test.run-id="$run_id" -DargLine="-Dbip.test.run-id=$run_id" verify

      - name: Verify public API documentation
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -DskipTests
          javadoc:javadoc

  packaging-qualification:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Qualify real Maven packaging with an ephemeral synthetic signer
        run: >-
          python3 .github/scripts/qualify-release-packaging.py
          --evidence "$RUNNER_TEMP/packaging-qualification"
          --deadline-seconds 900
      - name: Retain synthetic packaging evidence and cleanup result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: synthetic-packaging-${{ github.run_id }}
          path: ${{ runner.temp }}/packaging-qualification/
          if-no-files-found: error
          retention-days: 30
