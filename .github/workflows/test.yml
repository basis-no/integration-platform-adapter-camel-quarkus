name: Test

on:
  pull_request:
  push:
    branches:
      - main
      - release/0.3

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify matching version changelog and its guard
        run: |
          python3 -m unittest discover -s tests -p "test_changelog.py"
          python3 scripts/check_changelog.py

      - name: Test release notes extraction
        run: python3 -m unittest discover -s tests -p "test_release_notes.py"

      - name: Test offline release packaging and recovery guards
        run: python3 .github/scripts/test-release-packaging.py

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Test and install adapter for the fixtures
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          install

      - name: Read the installed adapter version
        run: |
          version="$(./mvnw --batch-mode --no-transfer-progress -q help:evaluate -Dexpression=project.version -DforceStdout)"
          echo "ADAPTER_VERSION=$version" >> "$GITHUB_ENV"

      - name: Verify Quarkus registration and dependency defaults
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -f integration-tests/maintenance-smoke/pom.xml
          -Dadapter.version="$ADAPTER_VERSION"
          verify

      # The fixtures below never pull an image themselves, so the pinned images
      # are pulled here. Each fixture run needs a unique run ID.
      - name: Pull the fixtures' pinned container images
        run: |
          docker pull postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
          docker pull confluentinc/cp-kafka@sha256:620734d9fc0bb1f9886932e5baf33806074469f40e3fe246a3fdbb59309535fa

      - name: Verify an existing application database keeps working
        run: |
          run_id="$(cat /proc/sys/kernel/random/uuid)"
          ./mvnw --batch-mode --no-transfer-progress \
            -f integration-tests/application-data-smoke/pom.xml \
            -Dadapter.version="$ADAPTER_VERSION" \
            -Dbip.test.run-id="$run_id" -DargLine="-Dbip.test.run-id=$run_id" verify

      - name: Verify Kafka ACL recovery and readiness
        run: |
          run_id="$(cat /proc/sys/kernel/random/uuid)"
          ./mvnw --batch-mode --no-transfer-progress \
            -f integration-tests/kafka-recovery-smoke/pom.xml \
            -Dadapter.version="$ADAPTER_VERSION" \
            -Dbip.test.run-id="$run_id" -DargLine="-Dbip.test.run-id=$run_id" verify

      - name: Verify the Key-Value Store and metrics at runtime
        run: |
          run_id="$(cat /proc/sys/kernel/random/uuid)"
          ./mvnw --batch-mode --no-transfer-progress \
            -f integration-tests/key-value-smoke/pom.xml \
            -Dadapter.version="$ADAPTER_VERSION" \
            -Dbip.test.run-id="$run_id" -DargLine="-Dbip.test.run-id=$run_id" verify

      - name: Verify public API documentation
        run: >-
          ./mvnw
          --batch-mode
          --no-transfer-progress
          -DskipTests
          javadoc:javadoc
