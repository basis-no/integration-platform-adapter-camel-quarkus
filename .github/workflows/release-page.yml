name: Verify published artifacts and create GitHub Release

# Manual trigger only; never builds, signs or uploads. The unsigned candidate
# comes from release.yml (protected tag run) or release-candidate.yml (offline
# signing). This path only reads public artifacts and notes with the public key.
# It replaces publish-central.yml on this line, so that workflow, whose older
# revisions on tags and branches publish on a tag push, can stay disabled.
on:
  workflow_dispatch:
    inputs:
      tag:
        required: true
        description: Existing approved final tag
      candidate_run:
        required: true
        description: Existing successful unsigned candidate inspection run
      signed_entries_sha256:
        required: true
        description: entries_sha256 from the reviewed offline signing receipt
      signer:
        required: true
        description: Trusted uppercase 40-character signing fingerprint

permissions:
  contents: read
  actions: read

concurrency:
  group: central-release-page-${{ inputs.tag }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag }}
  CANDIDATE_RUN: ${{ inputs.candidate_run }}
  SIGNED_ENTRIES_SHA256: ${{ inputs.signed_entries_sha256 }}
  SIGNER: ${{ inputs.signer }}

jobs:
  verify:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate existing tag and reviewed candidate inputs
        run: |
          version="$(.github/scripts/release-version-from-tag.sh "$TAG")"
          source_commit="$(git rev-parse "refs/tags/$TAG^{}")"
          python3 .github/scripts/release-candidate.py selection --mode readback --version "$version" --commit "$source_commit" --signer "$SIGNER" --candidate-run "$CANDIDATE_RUN" --bundle-hash "$SIGNED_ENTRIES_SHA256"
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "SOURCE_COMMIT=$source_commit" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: source
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-central-candidate-${{ env.RELEASE_VERSION }}
          path: evidence
          run-id: ${{ inputs.candidate_run }}
          github-token: ${{ github.token }}
      - name: Verify actual public payloads against the same reviewed candidate
        env:
          PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/central-public-readback-keyring"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"
          mkdir -m 700 "$GNUPGHOME"
          test -n "$PUBLIC_KEY"
          printf '%s\n' "$PUBLIC_KEY" | gpg --no-options --batch --import
          python3 -I .github/scripts/sign-candidate.py verify --candidate evidence --version "$RELEASE_VERSION" --source-commit "$SOURCE_COMMIT" --candidate-run "$CANDIDATE_RUN"
          python3 -I .github/scripts/verify-public-release.py --pom source/pom.xml --version "$RELEASE_VERSION" --signer "$SIGNER" --unsigned-receipt evidence/unsigned.json --entries-sha256 "$SIGNED_ENTRIES_SHA256" --output public-readback.json
      - name: Retain actual artifact readback
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: central-public-readback-${{ inputs.tag }}
          path: public-readback.json
          if-no-files-found: error
          retention-days: 90
      - name: Stop owned verifier agent and remove public-key keyring
        if: always()
        run: |
          if [ -n "${GNUPGHOME:-}" ]; then
            case "$GNUPGHOME" in "$RUNNER_TEMP"/central-*) gpgconf --kill gpg-agent || true; rm -rf -- "$GNUPGHOME" ;; *) exit 1 ;; esac
          fi

  github-release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          path: source
          persist-credentials: false
      - name: Extract reviewed release notes from the existing tag
        run: python3 .github/scripts/release-notes.py --tag "$TAG" --changelog source/CHANGELOG.md --pom source/pom.xml --output release-notes.md
      - name: Create GitHub Release and compare existing notes without overwriting
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --json body,tagName > release-readback.json; then
            gh release create "$TAG" --verify-tag --title "Camel Quarkus adapter ${TAG#v}" --notes-file release-notes.md
            gh release view "$TAG" --json body,tagName > release-readback.json
          fi
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          release = json.loads(Path('release-readback.json').read_text())
          assert release['tagName'] == os.environ['TAG'], 'Release tag mismatch'
          assert release['body'] == Path('release-notes.md').read_text(), 'Release notes mismatch: review; never overwrite automatically'
          PY
