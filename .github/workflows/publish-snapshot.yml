name: Snapshot publication suspended (releases are signed offline)

# Every Central upload requires the offline release signer; acceptance uses
# locally built artifacts. See docs/release-packaging.md#snapshot-lane.
# Existing signed releases and previously published snapshots are unaffected.
# Never add signing or publisher credentials to a source build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suspended:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse credential-bearing source builds
        run: |
          echo "Snapshot publication is suspended. See docs/release-packaging.md#snapshot-lane." >&2
          exit 1
