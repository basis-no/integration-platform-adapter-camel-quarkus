name: Snapshot publication suspended pending credential isolation

# Existing signed releases and previously published snapshots are unaffected.
# Do not restore repository signing or publisher credentials to a source build.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suspended:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Refuse credential-bearing source builds
        run: |
          echo "Snapshot publication is suspended. See docs/release-packaging.md." >&2
          exit 1
