version: 2
# On main, each ecosystem gets one grouped pull request a week with its minor
# and patch updates. A major update, and on main the Maven runtime, gets a pull
# request of its own. A new release is proposed only after it has been out for
# 3 days.
#
# Security updates always target the default branch and use the entries
# without target-branch. The release/0.3 entries cover version updates only.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    groups:
      maven:
        patterns: ["*"]
        # A new Maven runtime line can change how the build reads the POM, so
        # the Maven wrapper's distribution gets a pull request of its own.
        exclude-patterns: ["org.apache.maven:apache-maven"]
        update-types: [minor, patch]
    ignore:
      # Integrations build against the adapter's Quarkus and Camel line, so a new
      # minor or major line is a deliberate release decision, not a routine bump.
      # Quarkus patch updates stay in the group.
      - dependency-name: "io.quarkus.platform:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "io.quarkus:*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # The release/0.3 maintenance line takes patch updates only.
  - package-ecosystem: github-actions
    directory: /
    target-branch: release/0.3
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      actions-maintenance:
        patterns: ["*"]
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
  - package-ecosystem: maven
    directory: /
    target-branch: release/0.3
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      maven-maintenance:
        patterns: ["*"]
        update-types: [patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
