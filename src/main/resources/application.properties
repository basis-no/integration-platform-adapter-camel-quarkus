camel.component.kafka.auto-commit-enable=false
camel.component.kafka.allow-manual-commit=true
camel.component.kafka.break-on-first-error=true
# A failure while polling reconnects and polls the same position again, for
# example while a new topic's read permission is still being applied. Camel's
# default error-handler strategy routes the failure, without a record, to the
# error handler, moves past the offset, and stops polling for good after an
# authorization error.
camel.component.kafka.poll-on-error=RECONNECT
basis.message-store.sink=log
basis.message-store.status-topic=bip.message.status
basis.message-store.step-outcome-store=noop
basis.message-store.dlq-uri=kafka:bip.message.dlq
basis.message-store.payload.mode=postgres-inline
basis.message-store.payload.max-bytes=1048576
basis.message-store.payload.retention-days=30
basis.message-store.replay.enabled=true
basis.message-store.replay.input-topic-pattern=bip.%s.in

# One operator-owned security binding covers consumption, DLQ, replay and the Kafka sink.
camel.component.kafka.security-protocol=${basis.message-store.kafka.security-protocol:PLAINTEXT}
camel.component.kafka.sasl-mechanism=${basis.message-store.kafka.sasl-mechanism:SCRAM-SHA-512}
camel.component.kafka.sasl-jaas-config=${basis.message-store.kafka.sasl-jaas-config:}
camel.component.kafka.ssl-truststore-location=${basis.message-store.kafka.ssl-truststore-location:}
camel.component.kafka.ssl-truststore-type=${basis.message-store.kafka.ssl-truststore-type:JKS}
camel.component.kafka.ssl-endpoint-algorithm=https
